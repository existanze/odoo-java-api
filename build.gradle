plugins {
    id "com.jfrog.artifactory" version "4.33.1"
}

apply plugin: 'groovy'
apply plugin: 'maven-publish'

group = 'com.odoojava'
version = '3.3.7'

sourceCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    // test dependencies
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.assertj:assertj-core:3.3.0'
    testImplementation 'org.mock-server:mockserver-netty:3.10.2'

    // main dependencies
    implementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3'
    implementation 'javax.xml.bind:jaxb-api:2.4.0-b180830.0359'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.9.0'
    implementation 'com.github.briandilley.jsonrpc4j:jsonrpc4j:1.5.1'
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "jfrog"
            url = uri("https://central.existanze.gr/artifactory/ext-release-local")

            credentials {
                username = "$artifactoryUser"
                password = "$artifactoryPassword"
            }
        }
    }
}